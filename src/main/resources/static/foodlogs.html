<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>dietlog 식단 기록</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        h1 { display: flex; justify-content: space-between; align-items: center; }
        button.logout { font-size: 14px; padding: 6px 10px; cursor: pointer; }
        .form-box { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 6px; }
        .form-box input, .form-box select { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        .form-box button { padding: 8px 16px; margin-top: 8px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f5f5f5; }
        .delete-btn { color: red; cursor: pointer; background: none; border: none; }
        #message { color: red; margin-top: 10px; }
    </style>
</head>
<body>
<h1>내 식단 기록 <button class="logout" onclick="logout()">로그아웃</button></h1>

<div class="form-box">
    <h3>새 기록 등록</h3>
    <select id="category-select"></select>
    <input type="number" id="calorie" placeholder="칼로리 (kcal)" required min="1">
    <input type="text" id="memo" placeholder="메모 (음식명 등)">
    <input type="date" id="log-date">
    <button onclick="createFoodLog()">등록</button>
</div>

<div id="message"></div>

<table id="foodlog-table">
    <thead>
    <tr><th>날짜</th><th>칼로리</th><th>카테고리</th><th>메모</th><th></th></tr>
    </thead>
    <tbody id="foodlog-tbody"></tbody>
</table>

<script>
    const token = localStorage.getItem('accessToken');
    if (!token) window.location.href = '/login.html';

    const authHeader = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };

    function logout() {
        localStorage.removeItem('accessToken');
        window.location.href = '/login.html';
    }

    async function loadCategories() {
        const res = await fetch('/api/categories', { headers: authHeader });
        const categories = await res.json();
        const select = document.getElementById('category-select');
        select.innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    async function loadFoodLogs() {
        const yearMonth = new Date().toISOString().slice(0, 7);
        const res = await fetch(`/api/foodlogs?yearMonth=${yearMonth}&page=0&size=20`, { headers: authHeader });

        if (res.status === 401 || res.status === 403) {
            logout();
            return;
        }

        const page = await res.json();
        const tbody = document.getElementById('foodlog-tbody');
        tbody.innerHTML = page.content.map(f => `
    <tr>
      <td>${f.logDate}</td>
      <td>${f.calorie}</td>
      <td>${f.categoryName}</td>
      <td>${f.memo ?? ''}</td>
      <td><button class="delete-btn" onclick="deleteFoodLog(${f.id})">삭제</button></td>
    </tr>
  `).join('');
    }

    async function createFoodLog() {
        // 1. 선택된 카테고리의 텍스트(예: "점심")를 가져옵니다.
        const categorySelect = document.getElementById('category-select');
        const selectedText = categorySelect.options[categorySelect.selectedIndex].text;

        // 2. 텍스트에 맞춰 백엔드가 원하는 mealType 영어 값으로 변환합니다.
        let deducedMealType = 'BREAKFAST';
        if (selectedText === '점심') deducedMealType = 'LUNCH';
        else if (selectedText === '저녁') deducedMealType = 'DINNER';
        else if (selectedText === '간식') deducedMealType = 'SNACK';

        // 3. 서버로 보낼 데이터에 mealType을 다시 몰래 추가해줍니다.
        const body = {
            categoryId: Number(categorySelect.value),
            mealType: deducedMealType, // 백엔드 통과를 위한 필수 값
            calorie: Number(document.getElementById('calorie').value),
            memo: document.getElementById('memo').value,
            logDate: document.getElementById('log-date').value
        };

        const res = await fetch('/api/foodlogs', {
            method: 'POST',
            headers: authHeader,
            body: JSON.stringify(body)
        });

        if (res.ok) {
            document.getElementById('calorie').value = '';
            document.getElementById('memo').value = '';
            document.getElementById('message').innerText = ''; // 성공 시 에러 메시지 지우기
            loadFoodLogs();
        } else {
            document.getElementById('message').innerText = '등록 실패: 입력값을 확인하세요.';
        }
    }

    async function deleteFoodLog(id) {
        await fetch(`/api/foodlogs/${id}`, { method: 'DELETE', headers: authHeader });
        loadFoodLogs();
    }

    document.getElementById('log-date').value = new Date().toISOString().slice(0, 10);
    loadCategories();
    loadFoodLogs();
</script>
</body>
</html>
